<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Đăng ký tài khoản mới</h1>
</header>

<div class="login-box">
    <form>

        <label>Email:</label>
        <input type="email" required 
               placeholder="Nhập email..."
               pattern="^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}$"
               title="Vui lòng nhập email hợp lệ. Ví dụ: ten@gmail.com">

        <label>Mật khẩu:</label>
        <input type="password" required
               placeholder="Mật khẩu mạnh"
               pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[\W_]).{8,}$"
               title="Mật khẩu phải có ít nhất 8 ký tự, gồm chữ, số và ký tự đặc biệt">

        <label>Nhập lại mật khẩu:</label>
        <input type="password" required placeholder="Nhập lại mật khẩu">

        <button>Đăng ký</button>
        <a href="login.html">Đã có tài khoản? Đăng nhập</a>
        <a class="btn" href="index.html">Quay lại</a>


    </form>
</div>

</body>
</html>
